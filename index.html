<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Excel Web App</title>
    
    <!-- Luckysheet CSS CDN -->
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/plugins.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css' />
    
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #luckysheet {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Yahan poora Excel load hoga -->
    <div id="luckysheet"></div>

    <!-- Luckysheet Dependencies JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/js/luckysheet.js"></script>

    <script>
        // Sheet ko initialize karna
        $(function () {
            luckysheet.create({
                container: 'luckysheet', // Div ID jahan sheet banegi
                title: 'Mera Excel Web App',
                lang: 'en'
            });
        });
    </script>
</body>
</html>
